<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="neon">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#030712"><meta name="description" content="AuraSound Ultra 3D Player - پخش‌کننده موسیقی سه‌بعدی">
<link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icons/icon.svg" type="image/svg+xml">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<title>AuraSound Ultra 3D Player</title>
<style>
:root[data-theme=neon]{--primary:#00f0ff;--glow:rgba(0,240,255,.4);--glass:rgba(13,17,23,.65);--border:rgba(0,240,255,.25);--main:#f8fafc;--sub:#94a3b8}
:root[data-theme=cyberpunk]{--primary:#ff0055;--glow:rgba(255,0,85,.4);--glass:rgba(23,11,28,.7);--border:rgba(255,0,85,.3);--main:#ffe600;--sub:#f472b6}
:root[data-theme=galaxy]{--primary:#a855f7;--glow:rgba(168,85,247,.4);--glass:rgba(15,10,30,.7);--border:rgba(168,85,247,.3);--main:#f3e8ff;--sub:#c084fc}
:root[data-theme=matrix]{--primary:#22c55e;--glow:rgba(34,197,94,.4);--glass:rgba(5,20,10,.75);--border:rgba(34,197,94,.3);--main:#86efac;--sub:#4ade80}
:root[data-theme=gold]{--primary:#f59e0b;--glow:rgba(245,158,11,.4);--glass:rgba(24,18,9,.75);--border:rgba(245,158,11,.3);--main:#fef3c7;--sub:#fbbf24}
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-tap-highlight-color:transparent;user-select:none}
body{background:#030712;color:var(--main);height:100dvh;overflow:hidden;display:flex;justify-content:center;align-items:center}
#canvas-3d{position:fixed;inset:0;width:100%;height:100%;z-index:0}
.app-window{position:relative;z-index:1;width:100%;max-width:480px;height:100%;display:flex;flex-direction:column;background:var(--glass);backdrop-filter:blur(25px) saturate(180%);border-inline:1px solid var(--border);box-shadow:0 0 50px #000c}
.app-header{padding:14px 18px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border)}
.brand-logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.1rem;color:var(--primary);text-shadow:0 0 10px var(--glow)}
.header-nav{display:flex;gap:10px}.icon-btn{width:40px;height:40px;border-radius:12px;border:1px solid var(--border);background:#ffffff0d;color:var(--main);display:flex;align-items:center;justify-content:center;font-size:1.1rem;cursor:pointer}
.icon-btn:active,.glass-btn:active{background:var(--primary);color:#000;transform:scale(.95)}
.player-hero{padding:14px 20px 8px;display:flex;flex-direction:column;align-items:center}
.art-container{width:150px;height:150px;position:relative;display:flex;align-items:center;justify-content:center;margin-bottom:10px}
.art-disc{width:112px;height:112px;border-radius:50%;background:radial-gradient(circle,#ffffff1a,#000c);border:3px solid var(--border);display:flex;align-items:center;justify-content:center;box-shadow:0 0 30px var(--glow);position:relative;z-index:2}
.art-disc i{font-size:2.5rem;color:var(--primary)}#visualizer{position:absolute;inset:0;width:100%;height:100%;z-index:1}
.track-details{text-align:center;width:100%;margin-bottom:10px}.track-title{font-size:1.1rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 10px}.track-artist{font-size:.8rem;color:var(--sub);margin-top:4px}
.scrubber-box{width:100%;padding:0 10px;margin-bottom:10px}.progress-bar-wrapper{width:100%;height:20px;display:flex;align-items:center;cursor:pointer;position:relative;touch-action:pan-y}
.progress-track{width:100%;height:6px;background:#ffffff1a;border-radius:10px;overflow:hidden}.progress-fill{height:100%;width:0%;background:var(--primary);box-shadow:0 0 12px var(--primary);border-radius:10px}
.time-labels{display:flex;justify-content:space-between;font-size:.75rem;color:var(--sub);margin-top:4px;direction:ltr}
.controls-row{display:flex;align-items:center;justify-content:space-around;width:100%;margin-bottom:8px}
.btn-play-main{width:56px;height:56px;border-radius:50%;background:var(--primary);color:#000;display:flex;align-items:center;justify-content:center;font-size:1.4rem;border:0;cursor:pointer;box-shadow:0 0 25px var(--glow)}
.action-bar{display:flex;justify-content:center;padding:6px 16px;gap:8px}.glass-btn{background:#ffffff0a;border:1px solid var(--border);color:var(--main);padding:10px 12px;border-radius:14px;font-size:.78rem;font-weight:600;display:flex;align-items:center;justify-content:center;gap:7px;cursor:pointer;width:100%}
.filter-row{padding:0 16px 8px;display:flex;gap:8px}.select-custom{background:#0006;border:1px solid var(--border);color:var(--main);padding:8px;border-radius:12px;font-size:.72rem;outline:0;flex:1;min-width:0}.select-custom option{background:#101827;color:#fff}
.playlist-view{flex:1;overflow-y:auto;padding:0 16px 16px;overscroll-behavior:contain}
.playlist-card{display:flex;align-items:center;justify-content:space-between;padding:11px 13px;background:#ffffff08;border:1px solid #ffffff10;border-radius:15px;margin-bottom:8px;backdrop-filter:blur(10px)}
.playlist-card.active{background:#ffffff19;border-color:var(--primary);box-shadow:0 0 15px var(--glow)}
.card-info{display:flex;flex-direction:column;gap:5px;overflow:hidden;flex:1}.card-title{font-size:.88rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.card-meta{font-size:.7rem;color:var(--sub);display:flex;gap:12px}.card-actions{display:flex;align-items:center;gap:10px;margin-right:10px}.action-icon{font-size:1rem;color:var(--sub);cursor:pointer;padding:6px}.action-icon.favorite.active{color:#ff0055;text-shadow:0 0 10px #ff005599}
.bottom-sheet{position:fixed;bottom:-100%;left:0;right:0;background:#0a0f19f5;backdrop-filter:blur(30px);border-top:1px solid var(--border);border-radius:28px 28px 0 0;padding:18px;transition:bottom .35s;z-index:10;max-height:85dvh;overflow-y:auto}.bottom-sheet.open{bottom:0}
.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.knob-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}.knob-card{background:#ffffff08;border:1px solid var(--border);border-radius:15px;padding:11px 7px;text-align:center;font-size:.73rem}.knob-card input{width:100%;margin-top:8px;accent-color:var(--primary)}.eq-sliders-container{display:flex;justify-content:space-between;background:#0006;border:1px solid var(--border);padding:14px 8px;border-radius:18px;gap:3px}.eq-col{display:flex;flex-direction:column;align-items:center;font-size:.62rem;color:var(--sub);flex:1}.eq-col input{writing-mode:vertical-lr;direction:rtl;appearance:slider-vertical;width:8px;height:76px;margin:8px 0;accent-color:var(--primary)}
.car-dashboard{position:fixed;inset:0;background:#030712;z-index:20;display:flex;flex-direction:column;gap:18px;padding:20px;opacity:0;pointer-events:none;transition:opacity .3s;overflow-y:auto}.car-dashboard.active{opacity:1;pointer-events:auto}
.car-top-bar{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);padding-bottom:12px}.car-badge{background:var(--primary);color:#000;padding:7px 14px;border-radius:20px;font-weight:800;font-size:.85rem}
.car-center-info{text-align:center;margin:12px 0}.car-now-playing{font-size:1.5rem;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.car-now-album{font-size:1rem;color:var(--primary);margin-top:5px}
.car-volume-box{background:#ffffff0a;border:1px solid var(--border);border-radius:20px;padding:12px 16px;display:flex;align-items:center;gap:14px}.car-volume-box i{font-size:1.3rem;color:var(--primary)}.car-volume-slider{flex:1;accent-color:var(--primary)}
.car-giant-controls{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;align-items:center}.btn-car-giant{background:#ffffff0d;border:2px solid var(--border);border-radius:25px;color:#fff;font-size:2rem;height:90px;display:flex;align-items:center;justify-content:center}.btn-car-giant.play{height:105px;background:var(--primary);color:#000;font-size:2.8rem;box-shadow:0 0 35px var(--glow)}
.car-seek-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.btn-car-seek{background:#ffffff08;border:1px solid var(--border);border-radius:18px;color:var(--sub);font-size:1rem;height:58px;display:flex;align-items:center;justify-content:center;gap:8px}
input[type=file]{display:none}button{font:inherit}
@media(max-height:700px){.player-hero{padding-top:7px}.art-container{width:115px;height:115px}.art-disc{width:88px;height:88px}.art-disc i{font-size:2rem}.btn-play-main{width:48px;height:48px}}
</style></head>
<body><canvas id="canvas-3d"></canvas>
<div class="app-window">
<header class="app-header"><div class="brand-logo"><i class="fas fa-wave-square"></i> AuraSound 3D</div><div class="header-nav"><button class="icon-btn" id="btn-car-mode" title="حالت رانندگی"><i class="fas fa-car"></i></button><button class="icon-btn" id="btn-open-sheet" title="تنظیمات اکولایزر"><i class="fas fa-sliders-h"></i></button></div></header>
<section class="player-hero"><div class="art-container"><canvas id="visualizer"></canvas><div class="art-disc"><i class="fas fa-compact-disc"></i></div></div>
<div class="track-details"><div class="track-title" id="title">فایلی انتخاب نشده</div><div class="track-artist" id="artist">یک آهنگ انتخاب کنید</div></div>
<div class="scrubber-box"><div class="progress-bar-wrapper" id="progress-wrapper"><div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div></div><div class="time-labels"><span id="current-time">00:00</span><span id="duration">00:00</span></div></div>
<div class="controls-row"><button class="icon-btn" id="btn-shuffle"><i class="fas fa-random"></i></button><button class="icon-btn" id="btn-prev"><i class="fas fa-step-backward"></i></button><button class="btn-play-main" id="btn-play"><i class="fas fa-play"></i></button><button class="icon-btn" id="btn-next"><i class="fas fa-step-forward"></i></button><button class="icon-btn" id="btn-repeat"><i class="fas fa-redo"></i></button></div></section>
<div class="action-bar"><label class="glass-btn" id="btn-auto-scan"><i class="fas fa-search"></i> اسکن پوشه</label><label class="glass-btn"><i class="fas fa-file-audio"></i> انتخاب فایل<input type="file" id="file-input" multiple accept="audio/*"></label><input type="file" id="directory-input" webkitdirectory directory multiple accept="audio/*"></div>
<div class="filter-row"><select class="select-custom" id="sort-select"><option value="default">مرتب‌سازی پیش‌فرض</option><option value="name">نام آهنگ (الفبا)</option><option value="size">حجم فایل</option><option value="date">تاریخ افزودن</option><option value="favorites">فهرست علاقه‌مندی‌ها ❤️</option></select><select class="select-custom" id="theme-select"><option value="neon">نئون سیان (Neon)</option><option value="cyberpunk">سایبرپانک (Cyberpunk)</option><option value="galaxy">کهکشان بنفش (Galaxy)</option><option value="matrix">ماتریکس سبز (Matrix)</option><option value="gold">طلا (Luxury Gold)</option></select></div>
<div class="playlist-view" id="playlist-items"></div></div>
<div class="bottom-sheet" id="audio-sheet"><div class="sheet-head"><span style="font-weight:700"><i class="fas fa-sliders-h" style="color:var(--primary)"></i> تنظیمات بیس عمیق و صدای شفاف</span><button class="icon-btn" id="btn-close-sheet"><i class="fas fa-times"></i></button></div>
<div class="knob-grid"><div class="knob-card"><span style="color:var(--primary)">آمپلی‌فایر</span><input type="range" id="amp-gain" min="1" max="10" step=".2" value="1"><div id="amp-val">1.0x</div></div><div class="knob-card"><span>بیس نرم</span><input type="range" id="bass-boost" min="-12" max="18" step=".5" value="3"><div id="bass-val">+3.0 dB</div></div><div class="knob-card"><span>صدای زیر</span><input type="range" id="treble-boost" min="-12" max="15" step=".5" value="0"><div id="treble-val">0 dB</div></div></div>
<div class="eq-sliders-container"><div class="eq-col"><span>31</span><input type="range" class="eq-slider" data-index="0" min="-12" max="12" value="0"></div><div class="eq-col"><span>62</span><input type="range" class="eq-slider" data-index="1" min="-12" max="12" value="0"></div><div class="eq-col"><span>125</span><input type="range" class="eq-slider" data-index="2" min="-12" max="12" value="0"></div><div class="eq-col"><span>250</span><input type="range" class="eq-slider" data-index="3" min="-12" max="12" value="0"></div><div class="eq-col"><span>500</span><input type="range" class="eq-slider" data-index="4" min="-12" max="12" value="0"></div><div class="eq-col"><span>1k</span><input type="range" class="eq-slider" data-index="5" min="-12" max="12" value="0"></div><div class="eq-col"><span>2k</span><input type="range" class="eq-slider" data-index="6" min="-12" max="12" value="0"></div><div class="eq-col"><span>4k</span><input type="range" class="eq-slider" data-index="7" min="-12" max="12" value="0"></div><div class="eq-col"><span>8k</span><input type="range" class="eq-slider" data-index="8" min="-12" max="12" value="0"></div><div class="eq-col"><span>16k</span><input type="range" class="eq-slider" data-index="9" min="-12" max="12" value="0"></div></div>
</div>
<div class="car-dashboard" id="car-mode-overlay"><div class="car-top-bar"><div class="car-badge"><i class="fas fa-car"></i> حالت رانندگی ایمن</div><button class="icon-btn" id="btn-close-car-mode"><i class="fas fa-times"></i></button></div><div class="car-center-info"><div class="car-now-playing" id="car-title">فایلی انتخاب نشده</div><div class="car-now-album" id="car-artist">حالت لمس درشت</div></div><div class="car-volume-box"><i class="fas fa-volume-down"></i><input type="range" class="car-volume-slider" id="car-volume" min="0" max="1" step=".01" value="1"><i class="fas fa-volume-up"></i></div><div class="car-giant-controls"><button class="btn-car-giant" id="btn-car-prev"><i class="fas fa-backward"></i></button><button class="btn-car-giant play" id="btn-car-play"><i class="fas fa-play"></i></button><button class="btn-car-giant" id="btn-car-next"><i class="fas fa-forward"></i></button></div><div class="car-seek-row"><button class="btn-car-seek" id="btn-car-backward"><i class="fas fa-undo"></i> ۱۰ ثانیه</button><button class="btn-car-seek" id="btn-car-forward">۱۰ ثانیه <i class="fas fa-redo"></i></button></div></div>
<audio id="audio-element" preload="metadata"></audio>
<script>
const $=id=>document.getElementById(id),audio=$("audio-element"),playlist=[],eqFreq=[31,62,125,250,500,1000,2000,4000,8000,16000];
let currentIndex=-1,isShuffle=false,isRepeat=false,audioCtx,analyser,gainNode,bassFilter,trebleFilter,limiter,eqFilters=[],sourceNode,rafStarted=false;
const canvas=$("visualizer"),ctx=canvas.getContext("2d");canvas.width=150;canvas.height=150;
function initAudio(){if(audioCtx)return;const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;audioCtx=new AC();analyser=audioCtx.createAnalyser();analyser.fftSize=128;gainNode=audioCtx.createGain();bassFilter=audioCtx.createBiquadFilter();bassFilter.type="lowshelf";bassFilter.frequency.value=80;bassFilter.gain.value=+$("bass-boost").value;trebleFilter=audioCtx.createBiquadFilter();trebleFilter.type="highshelf";trebleFilter.frequency.value=3500;limiter=audioCtx.createDynamicsCompressor();eqFilters=eqFreq.map(f=>{let n=audioCtx.createBiquadFilter();n.type="peaking";n.frequency.value=f;n.Q.value=1.4;return n});sourceNode=audioCtx.createMediaElementSource(audio);let node=sourceNode;[gainNode,bassFilter,trebleFilter,...eqFilters,limiter,analyser].forEach(n=>{node.connect(n);node=n});analyser.connect(audioCtx.destination);drawVisualizer()}
function drawVisualizer(){if(!analyser)return;const data=new Uint8Array(analyser.frequencyBinCount);analyser.getByteFrequencyData(data);ctx.clearRect(0,0,150,150);ctx.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue("--primary");ctx.lineWidth=3;for(let i=0;i<40;i++){let a=i*Math.PI/20,h=(data[i]||0)/255*27,r=53;ctx.beginPath();ctx.moveTo(75+Math.cos(a)*r,75+Math.sin(a)*r);ctx.lineTo(75+Math.cos(a)*(r+h),75+Math.sin(a)*(r+h));ctx.stroke()}requestAnimationFrame(drawVisualizer)}
function favoriteKey(file){return "aurasound-fav:"+[file.name,file.size,file.lastModified].join("|")}
function addFiles(files){let added=0;[...files].filter(f=>f.type.startsWith("audio/")||/\.(mp3|m4a|wav|aac|ogg|flac|opus)$/i.test(f.name)).forEach(file=>{if(playlist.some(t=>t.file.name===file.name&&t.file.size===file.size))return;let fav=false;try{fav=localStorage.getItem(favoriteKey(file))==="1"}catch(e){}playlist.push({file,url:URL.createObjectURL(file),title:file.name.replace(/\.[^.]+$/,""),artist:"حافظه دستگاه",sizeBytes:file.size,size:(file.size/1048576).toFixed(1)+" MB",dateMs:file.lastModified,date:new Date(file.lastModified).toLocaleDateString("fa-IR"),isFavorite:fav});added++});render();if(currentIndex<0&&playlist.length)playTrack(0);return added}
function render(){let list=[...playlist],sort=$("sort-select").value;if(sort==="name")list.sort((a,b)=>a.title.localeCompare(b.title,"fa"));if(sort==="size")list.sort((a,b)=>b.sizeBytes-a.sizeBytes);if(sort==="date")list.sort((a,b)=>b.dateMs-a.dateMs);if(sort==="favorites")list=list.filter(t=>t.isFavorite);$("playlist-items").innerHTML="";if(!list.length){$("playlist-items").innerHTML='<div style="text-align:center;color:var(--sub);padding:30px;font-size:.85rem">آهنگی یافت نشد</div>';return}list.forEach(t=>{let idx=playlist.indexOf(t),card=document.createElement("div");card.className="playlist-card"+(idx===currentIndex?" active":"");let info=document.createElement("div");info.className="card-info";let title=document.createElement("div");title.className="card-title";title.textContent=t.title;let meta=document.createElement("div");meta.className="card-meta";meta.textContent=t.size+" • "+t.date;info.append(title,meta);info.onclick=()=>playTrack(idx);let actions=document.createElement("div");actions.className="card-actions";let fav=document.createElement("i");fav.className="fas fa-heart action-icon favorite"+(t.isFavorite?" active":"");fav.setAttribute("role","button");fav.setAttribute("aria-label",t.isFavorite?"حذف از علاقه‌مندی‌ها":"افزودن به علاقه‌مندی‌ها");fav.onclick=()=>{t.isFavorite=!t.isFavorite;try{if(t.isFavorite)localStorage.setItem(favoriteKey(t.file),"1");else localStorage.removeItem(favoriteKey(t.file))}catch(e){}render()};let share=document.createElement("i");share.className="fas fa-share-alt action-icon";share.onclick=async()=>{try{if(navigator.share)await navigator.share({title:t.title,text:"شنیدن آهنگ "+t.title});else{await navigator.clipboard.writeText(t.title);alert("نام آهنگ کپی شد")}}catch(e){}};actions.append(fav,share);card.append(info,actions);$("playlist-items").append(card)})}
function updateButtons(){let html=isPlaying()?'<i class="fas fa-pause"></i>':'<i class="fas fa-play"></i>';$("btn-play").innerHTML=html;$("btn-car-play").innerHTML=html}
function isPlaying(){return !audio.paused&&!audio.ended}
async function playTrack(i){if(i<0||i>=playlist.length)return;currentIndex=i;initAudio();if(audioCtx?.state==="suspended")await audioCtx.resume();audio.src=playlist[i].url;$("title").textContent=playlist[i].title;$("artist").textContent=playlist[i].artist;$("car-title").textContent=playlist[i].title;$("car-artist").textContent=playlist[i].artist;try{await audio.play()}catch(e){console.warn("Playback failed",e)}updateButtons();render();mediaSession(playlist[i])}
async function togglePlay(){if(currentIndex<0){if(playlist.length)await playTrack(0);return}initAudio();if(audioCtx?.state==="suspended")await audioCtx.resume();if(audio.paused){try{await audio.play()}catch(e){console.warn(e)}}else audio.pause();updateButtons()}
function next(){if(!playlist.length)return;let n=isShuffle?Math.floor(Math.random()*playlist.length):currentIndex+1;if(n>=playlist.length)n=0;playTrack(n)}
function prev(){if(!playlist.length)return;playTrack((currentIndex-1+playlist.length)%playlist.length)}
$("btn-play").onclick=togglePlay;$("btn-car-play").onclick=togglePlay;$("btn-next").onclick=next;$("btn-prev").onclick=prev;$("btn-car-next").onclick=next;$("btn-car-prev").onclick=prev;
$("btn-shuffle").onclick=()=>{isShuffle=!isShuffle;$("btn-shuffle").style.color=isShuffle?"var(--primary)":"var(--main)"};
$("btn-repeat").onclick=()=>{isRepeat=!isRepeat;$("btn-repeat").style.color=isRepeat?"var(--primary)":"var(--main)"};
$("file-input").onchange=e=>{addFiles(e.target.files);e.target.value=""};
$("btn-auto-scan").onclick=async()=>{if(!("showDirectoryPicker"in window)){ $("directory-input").click();return }try{const dir=await window.showDirectoryPicker({id:"aurasound-music",mode:"read"});const found=[];async function walk(d){for await(const entry of d.values()){if(entry.kind==="file"){const f=await entry.getFile();if(f.type.startsWith("audio/")||/\.(mp3|m4a|wav|aac|ogg|flac|opus)$/i.test(f.name))found.push(f)}else if(entry.kind==="directory")await walk(entry)}}await walk(dir);const count=addFiles(found);alert(count+" فایل موسیقی جدید اضافه شد.")}catch(e){if(e.name!=="AbortError")alert("دسترسی به پوشه انجام نشد. دوباره اجازه دسترسی بدهید.")}};
$("directory-input").onchange=e=>{const count=addFiles(e.target.files);if(count)alert(count+" فایل موسیقی جدید اضافه شد.");e.target.value=""};
$("sort-select").onchange=render;$("theme-select").onchange=e=>{document.documentElement.dataset.theme=e.target.value;const colors={neon:0x00f0ff,cyberpunk:0xff0055,galaxy:0xa855f7,matrix:0x22c55e,gold:0xf59e0b};if(particleMaterial)particleMaterial.color.setHex(colors[e.target.value])};
$("btn-open-sheet").onclick=()=>$("audio-sheet").classList.add("open");$("btn-close-sheet").onclick=()=>$("audio-sheet").classList.remove("open");$("btn-car-mode").onclick=()=>$("car-mode-overlay").classList.add("active");$("btn-close-car-mode").onclick=()=>$("car-mode-overlay").classList.remove("active");
$("car-volume").oninput=e=>audio.volume=+e.target.value;$("btn-car-forward").onclick=()=>{if(Number.isFinite(audio.duration))audio.currentTime=Math.min(audio.duration,audio.currentTime+10)};$("btn-car-backward").onclick=()=>audio.currentTime=Math.max(0,audio.currentTime-10);
$("amp-gain").oninput=e=>{$("amp-val").textContent=(+e.target.value).toFixed(1)+"x";if(gainNode)gainNode.gain.setTargetAtTime(+e.target.value,audioCtx.currentTime,.02)};
$("bass-boost").oninput=e=>{$("bass-val").textContent=(+e.target.value>0?"+":"")+(+e.target.value).toFixed(1)+" dB";if(bassFilter)bassFilter.gain.setTargetAtTime(+e.target.value,audioCtx.currentTime,.02)};
$("treble-boost").oninput=e=>{$("treble-val").textContent=(+e.target.value>0?"+":"")+(+e.target.value).toFixed(1)+" dB";if(trebleFilter)trebleFilter.gain.setTargetAtTime(+e.target.value,audioCtx.currentTime,.02)};
document.querySelectorAll(".eq-slider").forEach(s=>s.oninput=()=>{let f=eqFilters[+s.dataset.index];if(f&&audioCtx)f.gain.setTargetAtTime(+s.value,audioCtx.currentTime,.02)});
audio.ontimeupdate=()=>{if(!Number.isFinite(audio.duration)||!audio.duration)return;$("progress-fill").style.width=(audio.currentTime/audio.duration*100)+"%";$("current-time").textContent=fmt(audio.currentTime);$("duration").textContent=fmt(audio.duration)};
audio.onplay=updateButtons;audio.onpause=updateButtons;audio.onended=()=>isRepeat?playTrack(currentIndex):next();
$("progress-wrapper").onclick=e=>{if(!Number.isFinite(audio.duration)||!audio.duration)return;let r=e.currentTarget.getBoundingClientRect();let pct=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width));audio.currentTime=pct*audio.duration};
function fmt(s){let m=Math.floor(s/60),v=Math.floor(s%60);return String(m).padStart(2,"0")+":"+String(v).padStart(2,"0")}
function mediaSession(t){if(!("mediaSession"in navigator)||!window.MediaMetadata)return;navigator.mediaSession.metadata=new MediaMetadata({title:t.title,artist:t.artist,album:"AuraSound 3D",artwork:[{src:"./icons/icon.svg",sizes:"any",type:"image/svg+xml"}]});for(const [a,fn] of [["play",togglePlay],["pause",togglePlay],["previoustrack",prev],["nexttrack",next]])try{navigator.mediaSession.setActionHandler(a,fn)}catch(e){}}
let scene,camera,renderer,particles,particleMaterial;
function init3D(){if(!window.THREE)return;try{let el=$("canvas-3d");scene=new THREE.Scene();camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.1,1000);camera.position.z=30;renderer=new THREE.WebGLRenderer({canvas:el,alpha:true,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);let count=600,pos=new Float32Array(count*3);for(let i=0;i<pos.length;i++)pos[i]=(Math.random()-.5)*80;let geo=new THREE.BufferGeometry();geo.setAttribute("position",new THREE.BufferAttribute(pos,3));particleMaterial=new THREE.PointsMaterial({size:.8,color:0x00f0ff,transparent:true,opacity:.6});particles=new THREE.Points(geo,particleMaterial);scene.add(particles);function animate(){requestAnimationFrame(animate);particles.rotation.y+=.0015;particles.rotation.x+=.0008;renderer.render(scene,camera)}animate()}catch(e){console.warn("3D visualizer unavailable",e)}}
addEventListener("resize",()=>{if(camera&&renderer){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}});
init3D();if("serviceWorker"in navigator&&location.protocol!=="file:")addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(console.warn));
</script></body></html>
