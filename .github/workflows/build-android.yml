name: AuraSound Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract AuraSound native update
        run: |
          unzip -o AuraSound-3D-Player-Android-Native-Update.zip -d /tmp/aura-update
          cp -a /tmp/aura-update/. .
          python3 native/android/patch_clear_playlist.py index.html
          python3 native/android/patch_native_library.py

      - name: Verify updated source
        run: |
          grep -q "btn-create-playlist" index.html
          grep -q "btn-delete-playlist" index.html
          ! grep -q 'id="btn-scan-folder"' index.html
          grep -q "mergeNativeTracks" index.html
          grep -q "toggleFavorite" index.html
          grep -q "startWatchingLibrary" index.html
          grep -q "registerMediaStoreObserver" native/android/AuraNativePlugin.java
          grep -q "legacyAudio" native/android/AuraNativePlugin.java
          grep -q 'android:maxSdkVersion="32"' native/android/patch_manifest.py

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK Packages
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: npm install

      - name: Prepare web files
        run: npm run prepare-web

      - name: Add Android platform
        run: npx cap add android

      - name: Install AuraSound native Android bridge
        run: |
          mkdir -p android/app/src/main/java/com/aurasound/player
          cp native/android/AuraNativePlugin.java android/app/src/main/java/com/aurasound/player/AuraNativePlugin.java
          cp native/android/AuraScanService.java android/app/src/main/java/com/aurasound/player/AuraScanService.java
          python3 native/android/patch_manifest.py android/app/src/main/AndroidManifest.xml
          python3 native/android/patch_main.py android/app/src/main/java/com/aurasound/player/MainActivity.java

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AuraSound-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
