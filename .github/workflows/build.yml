          @Composable
          fun Knob(label: String, value: Float, range: ClosedFloatingPointRange<Float>,
              display: String, color: Color, enabled: Boolean = true, onChange: (Float) -> Unit) {
              val span = (range.endInclusive - range.start).coerceAtLeast(0.001f)
              val currentValue by rememberUpdatedState(value)
              val progress = ((value - range.start) / span).coerceIn(0f, 1f)
              Column(Modifier.width(98.dp).padding(vertical = 2.dp), horizontalAlignment = Alignment.CenterHorizontally) {
                  Text(label, color = if (enabled) TextHi else TextLo, fontSize = 10.sp,
                      maxLines = 1, fontWeight = FontWeight.Medium)
                  Canvas(Modifier.padding(top = 3.dp).size(78.dp).pointerInput(enabled, range) {
                      if (!enabled) return@pointerInput
                      var lastAngle = Float.NaN
                      detectDragGestures(
                          onDragStart = { p ->
                              lastAngle = atan2(p.y - size.height / 2f, p.x - size.width / 2f)
                          },
                          onDragEnd = { lastAngle = Float.NaN },
                          onDragCancel = { lastAngle = Float.NaN },
                          onDrag = { change, _ ->
                              change.consume()
                              val angle = atan2(change.position.y - size.height / 2f,
                                  change.position.x - size.width / 2f)
                              if (!lastAngle.isNaN()) {
                                  var delta = angle - lastAngle
                                  if (delta > PI.toFloat()) delta -= 2f * PI.toFloat()
                                  if (delta < -PI.toFloat()) delta += 2f * PI.toFloat()
                                  onChange((currentValue + delta / (3f * PI.toFloat()) * span)
                                      .coerceIn(range.start, range.endInclusive))
                              }
                              lastAngle = angle
                          }
                      )
                  }) {
                      val center = Offset(size.width / 2f, size.height / 2f)
                      val radius = size.width * 0.39f
                      drawCircle(Color(0xFF171522), radius + size.width * 0.09f, center)
                      drawCircle(Color(0xFF343044), radius, center,
                          style = Stroke(size.width * 0.075f, cap = StrokeCap.Round))
                      drawArc(color.copy(alpha = if (enabled) 0.95f else 0.35f),
                          135f, 270f * progress, false,
                          Offset(center.x - radius, center.y - radius),
                          androidx.compose.ui.geometry.Size(radius * 2f, radius * 2f),
                          style = Stroke(size.width * 0.075f, cap = StrokeCap.Round))
                      val a = (135f + 270f * progress) * PI.toFloat() / 180f
                      drawLine(if (enabled) Color.White else TextLo,
                          Offset(center.x + cos(a) * radius * 0.25f, center.y + sin(a) * radius * 0.25f),
                          Offset(center.x + cos(a) * radius * 0.78f, center.y + sin(a) * radius * 0.78f),
                          size.width * 0.07f, cap = StrokeCap.Round)
                      drawCircle(color, size.width * 0.045f, center)
                  }
                  Text(display, color = if (enabled) color else TextLo, fontSize = 10.sp, fontWeight = FontWeight.Bold)
              }
          }

