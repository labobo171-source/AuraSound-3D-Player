          cat > app/src/main/java/ir/player/music/Sound.kt <<'EOF'
          package ir.player.music

          import android.media.audiofx.Equalizer
          import android.media.audiofx.LoudnessEnhancer
          import kotlinx.coroutines.flow.MutableStateFlow
          import kotlin.math.abs
          import kotlin.math.roundToInt
          import kotlin.math.pow

          data class SoundState(
              val power: Boolean = true,
              val muted: Boolean = false,
              val ampDb: Float = 0f,
              val bass: Float = 0f,
              val treble: Float = 0f,
              val bands: List<Float> = List(8) { 0f },
              val surround3d: Boolean = false,
              val speaker3d: Boolean = false,
              val intensity: Float = 55f,
              val drivingMode: Boolean = false,
              val safe: Boolean = true,
              val motion: Boolean = true,
              val spectrum: Boolean = true,
              val palette: Int = 0
          )

          data class EngineInfo(
              val freqs: List<Int> = listOf(60, 230, 910, 3600, 14000),
              val eqOk: Boolean = false,
              val ampOk: Boolean = false,
              val spatialOk: Boolean = false,
              val rangeDb: Int = 15
          )

          object Sound {
              val state = MutableStateFlow(SoundState())
              val sessionId = MutableStateFlow(0)
              val info = MutableStateFlow(EngineInfo())
              fun set(f: (SoundState) -> SoundState) { state.value = f(state.value) }
              fun band(i: Int, v: Float) = set { s ->
                  val b = s.bands.toMutableList()
                  if (i in b.indices) b[i] = v
                  s.copy(bands = b)
              }
              fun gain(s: SoundState): Float = s.ampDb.coerceIn(0f, if (s.safe) 3.5f else 5f)
              fun outputGain(s: SoundState): Float {
                  val bandPeak = (s.bands.maxOrNull() ?: 0f).coerceAtLeast(0f) * 0.0525f
                  val tonePeak = s.bass.coerceAtLeast(0f) * 0.02625f +
                      s.treble.coerceAtLeast(0f) * 0.02625f
                  val headroomDb = (gain(s) + bandPeak + tonePeak).coerceIn(0f, 10f)
                  return 10f.pow(-headroomDb / 20f).coerceIn(0.30f, 1f)
              }
          }

          data class Preset(
              val name: String, val amp: Float, val bass: Float,
              val treble: Float, val curve: List<Float>
          )

          val PRESETS = listOf(
              Preset("خنثی", 0f, 0f, 0f, listOf(0f, 0f, 0f, 0f, 0f)),
              Preset("بیس نرم", 1f, -35f, 15f, listOf(0f, -10f, 6f, 10f, 14f)),
              Preset("زیر شفاف", 1f, -15f, 42f, listOf(-6f, -4f, 0f, 18f, 24f)),
              Preset("بلند", 2f, -20f, 25f, listOf(0f, -6f, 4f, 12f, 18f)),
              Preset("وکال", 1f, -30f, 30f, listOf(-20f, -10f, 22f, 26f, 10f)),
              Preset("سینمایی", 2f, 18f, 22f, listOf(12f, 8f, -6f, 6f, 16f)),
              Preset("شب", 0f, -25f, -15f, listOf(-12f, -8f, 0f, -8f, -14f))
          )

          fun presetCurve(base: List<Float>): List<Float> =
              List(8) { i -> base.getOrElse(i) { 0f } }

          class SoundEngine(sessionId: Int) {

              private val eq = try { Equalizer(0, sessionId) } catch (t: Throwable) { null }
              private val amp = try { LoudnessEnhancer(sessionId) } catch (t: Throwable) { null }

              private var min = -1500
              private var max = 1500
              private var n = 0
              private var bassIdx = 0
              private var trebleIdx = 0
              private val freqs = ArrayList<Int>()

              init {
                  try {
                      eq?.let { e ->
                          e.bandLevelRange?.let { r ->
                              if (r.size >= 2) { min = r[0].toInt(); max = r[1].toInt() }
                          }
                          n = e.numberOfBands.toInt()
                          for (b in 0 until n) freqs.add(e.getCenterFreq(b.toShort()) / 1000)
                          var bb = Int.MAX_VALUE
                          var tt = Int.MAX_VALUE
                          for (b in 0 until n) {
                              val f = freqs[b]
                              if (abs(f - 90) < bb) { bb = abs(f - 90); bassIdx = b }
                              if (abs(f - 10000) < tt) { tt = abs(f - 10000); trebleIdx = b }
                          }
                          e.enabled = true
                      }
                  } catch (_: Throwable) { }
                  Sound.info.value = EngineInfo(
                      freqs = if (freqs.isEmpty()) listOf(60, 230, 910, 3600, 14000) else freqs.toList(),
                      eqOk = eq != null && n > 0,
                      ampOk = amp != null,
                      spatialOk = true,
                      rangeDb = (max / 100).coerceAtLeast(1)
                  )
              }

              fun apply(s: SoundState) {
                  val on = s.power
                  val g = Sound.gain(s)
                  try {
                      amp?.enabled = on && g > 0f
                      amp?.setTargetGain((g * 100f).roundToInt())
                  } catch (_: Throwable) { }
                  val e = eq ?: return
                  if (n <= 0) return
                  try {
                      e.enabled = on
                      val lv = FloatArray(n)
                      if (on) {
                          for (b in 0 until n) {
                              val hz = e.getCenterFreq(b.toShort()) / 1000
                              lv[b] = when {
                                  hz in 2500..7000 -> 0.065f
                                  hz in 7001..12000 -> 0.03f
                                  hz < 90 -> -0.018f
                                  else -> 0f
                              }
                          }
                      }
                      for (b in 0 until n) {
                          val v = lv[b].coerceIn(-0.35f, 0.35f)
                          val mb = (if (v >= 0f) v * max else v * -min).roundToInt().toShort()
                          e.setBandLevel(b.toShort(), mb)
                      }
                  } catch (_: Throwable) { }
              }

              fun release() {
                  try { eq?.enabled = false; eq?.release() } catch (_: Throwable) { }
                  try { amp?.enabled = false; amp?.release() } catch (_: Throwable) { }
              }
          }
          EOF
          cat > app/src/main/java/ir/player/music/StereoSpatialAudioProcessor.kt <<'EOF'
          package ir.player.music

          import android.media.AudioFormat
          import androidx.media3.common.audio.AudioProcessor
          import androidx.media3.common.audio.BaseAudioProcessor
          import androidx.media3.common.util.UnstableApi
          import java.nio.ByteBuffer
          import kotlin.math.roundToInt

          @OptIn(UnstableApi::class)
          class StereoSpatialAudioProcessor(
              private val stateProvider: () -> SoundState
          ) : BaseAudioProcessor() {

              override fun onConfigure(inputAudioFormat: AudioProcessor.AudioFormat): AudioProcessor.AudioFormat {
                  val supportedEncoding = inputAudioFormat.encoding == AudioFormat.ENCODING_PCM_16BIT ||
                      inputAudioFormat.encoding == AudioFormat.ENCODING_PCM_FLOAT
                  return if (inputAudioFormat.channelCount == 2 && supportedEncoding) {
                      inputAudioFormat
                  } else {
                      AudioProcessor.AudioFormat.NOT_SET
                  }
              }

              override fun queueInput(inputBuffer: ByteBuffer) {
                  val bytes = inputBuffer.remaining()
                  if (bytes == 0) return
                  val output = replaceOutputBuffer(bytes)
                  val state = stateProvider()
                  val level = (state.intensity.coerceIn(0f, 100f) / 100f) *
                      if (state.drivingMode) 0.72f else 1f
                  val surroundWidth = if (state.surround3d) 0.78f * level else 0f
                  val speakerWidth = if (state.speaker3d) 0.48f * level else 0f
                  val width = 1f + surroundWidth + speakerWidth
                  val floatPcm = inputAudioFormat.encoding == AudioFormat.ENCODING_PCM_FLOAT

                  while (inputBuffer.remaining() >= if (floatPcm) 8 else 4) {
                      val left: Float
                      val right: Float
                      if (floatPcm) {
                          left = inputBuffer.float
                          right = inputBuffer.float
                      } else {
                          left = inputBuffer.short / 32768f
                          right = inputBuffer.short / 32768f
                      }

                      var outLeft = left
                      var outRight = right
                      if (state.power && (state.surround3d || state.speaker3d) && level > 0f) {
                          val mid = (left + right) * 0.5f
                          val side = (left - right) * 0.5f * width
                          outLeft = mid + side
                          outRight = mid - side
                      }

                      if (floatPcm) {
                          output.putFloat(outLeft.coerceIn(-1f, 1f))
                          output.putFloat(outRight.coerceIn(-1f, 1f))
                      } else {
                          output.putShort((outLeft.coerceIn(-1f, 1f) * 32767f).roundToInt().toShort())
                          output.putShort((outRight.coerceIn(-1f, 1f) * 32767f).roundToInt().toShort())
                      }
                  }
                  while (inputBuffer.hasRemaining()) output.put(inputBuffer.get())
                  output.flip()
              }
          }
          EOF
          cat > app/src/main/java/ir/player/music/PlayerService.kt <<'EOF'
          package ir.player.music

          import android.content.Intent
          import androidx.media3.common.AudioAttributes
          import androidx.media3.common.C
          import androidx.media3.common.util.UnstableApi
          import androidx.media3.common.Player
          import androidx.media3.exoplayer.ExoPlayer
          import androidx.media3.session.DefaultMediaNotificationProvider
          import androidx.media3.session.MediaSession
          import androidx.media3.session.MediaSessionService
          import androidx.media3.exoplayer.DefaultRenderersFactory
          import androidx.media3.exoplayer.audio.AudioSink
          import androidx.media3.exoplayer.audio.DefaultAudioSink
          import kotlinx.coroutines.CoroutineScope
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.SupervisorJob
          import kotlinx.coroutines.cancel
          import kotlinx.coroutines.flow.combine
          import kotlinx.coroutines.launch

          @OptIn(UnstableApi::class)
          class PlayerService : MediaSessionService() {

              private var player: ExoPlayer? = null
              private var session: MediaSession? = null
              private var engine: SoundEngine? = null
              private var engineId = 0
              private val scope = CoroutineScope(Dispatchers.Main + SupervisorJob())

              override fun onCreate() {
                  super.onCreate()
                  val spatialProcessor = StereoSpatialAudioProcessor { Sound.state.value }
                  val renderersFactory = object : DefaultRenderersFactory(this) {
                      override fun buildAudioSink(
                          context: android.content.Context,
                          enableFloatOutput: Boolean,
                          enableAudioTrackPlaybackParams: Boolean
                      ): AudioSink {
                          return DefaultAudioSink.Builder(context)
                              .setEnableFloatOutput(enableFloatOutput)
                              .setAudioProcessors(arrayOf(spatialProcessor))
                              .build()
                      }
                  }
                  val p = ExoPlayer.Builder(this, renderersFactory)
                      .setAudioAttributes(
                          AudioAttributes.Builder()
                              .setUsage(C.USAGE_MEDIA)
                              .setContentType(C.AUDIO_CONTENT_TYPE_MUSIC)
                              .build(), true
                      )
                      .setHandleAudioBecomingNoisy(true)
                      .setWakeMode(C.WAKE_MODE_LOCAL)
                      .build()

                  p.addListener(object : Player.Listener {
                      override fun onAudioSessionIdChanged(audioSessionId: Int) {
                          Sound.sessionId.value = audioSessionId
                      }
                  })
                  Sound.sessionId.value = p.audioSessionId
                  player = p
                  session = MediaSession.Builder(this, p).build()

                  try {
                      setMediaNotificationProvider(
                          DefaultMediaNotificationProvider.Builder(this)
                              .build()
                      )
                  } catch (_: Throwable) { }

                  scope.launch {
                      combine(Sound.sessionId, Sound.state) { id, st -> id to st }
                          .collect { pair ->
                              val id = pair.first
                              if (id != engineId) {
                                  engine?.release()
                                  engine = null
                                  engineId = id
                                  if (id > 0) engine = SoundEngine(id)
                              }
                              engine?.apply(pair.second)
                          }
                  }
                  scope.launch {
                      Sound.state.collect { st ->
                          player?.volume = if (st.muted) 0f else Sound.outputGain(st) * 0.88f
                      }
                  }
              }

              override fun onGetSession(controllerInfo: MediaSession.ControllerInfo): MediaSession? = session

              override fun onTaskRemoved(rootIntent: Intent?) {
                  val p = session?.player
                  if (p == null || !p.playWhenReady || p.mediaItemCount == 0) stopSelf()
              }

              override fun onDestroy() {
                  engine?.release(); engine = null
                  scope.cancel()
                  session?.release(); session = null
                  player?.release(); player = null
                  super.onDestroy()
              }
          }
          EOF
