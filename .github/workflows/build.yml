          fun fmt(ms: Long): String {
              val t = (ms / 1000L).coerceAtLeast(0L)
              return "%d:%02d".format(t / 60, t % 60)
          }

          fun loadSongs(ctx: Context): List<Song> {
              val out = ArrayList<Song>()
              val proj = arrayOf(
                  MediaStore.Audio.Media._ID, MediaStore.Audio.Media.TITLE,
                  MediaStore.Audio.Media.ARTIST, MediaStore.Audio.Media.DURATION,
                  MediaStore.Audio.Media.DATE_ADDED
              )
              try {
                  ctx.contentResolver.query(
                      MediaStore.Audio.Media.EXTERNAL_CONTENT_URI, proj,
                      "${MediaStore.Audio.Media.IS_MUSIC} != 0", null,
                      "${MediaStore.Audio.Media.TITLE} COLLATE NOCASE ASC"
                  )?.use { c ->
                      val iId = c.getColumnIndexOrThrow(MediaStore.Audio.Media._ID)
                      val iT = c.getColumnIndexOrThrow(MediaStore.Audio.Media.TITLE)
                      val iA = c.getColumnIndexOrThrow(MediaStore.Audio.Media.ARTIST)
                      val iD = c.getColumnIndexOrThrow(MediaStore.Audio.Media.DURATION)
                      val iAdded = c.getColumnIndexOrThrow(MediaStore.Audio.Media.DATE_ADDED)
                      while (c.moveToNext()) {
                          val d = c.getLong(iD)
                          if (d < 20000L) continue
                          val id = c.getLong(iId)
                          out += Song(
                              id,
                              ContentUris.withAppendedId(MediaStore.Audio.Media.EXTERNAL_CONTENT_URI, id),
                              c.getString(iT) ?: "بی‌نام",
                              c.getString(iA) ?: "ناشناس", d, c.getLong(iAdded)
                          )
                      }
                  }
              } catch (_: Throwable) { }
              return out
          }

          @Composable
          fun App(p: Pal, s: SoundState) {
              val ctx = LocalContext.current
              val info by Sound.info.collectAsState()
              val audioPerm = if (Build.VERSION.SDK_INT >= 33)
                  Manifest.permission.READ_MEDIA_AUDIO else Manifest.permission.READ_EXTERNAL_STORAGE

              fun ok() = ContextCompat.checkSelfPermission(ctx, audioPerm) == PackageManager.PERMISSION_GRANTED
              fun perms() = if (Build.VERSION.SDK_INT >= 33)
                  arrayOf(audioPerm, Manifest.permission.POST_NOTIFICATIONS) else arrayOf(audioPerm)

              var granted by remember { mutableStateOf(ok()) }
              var songs by remember { mutableStateOf(emptyList<Song>()) }
              var query by remember { mutableStateOf("") }
              var sort by remember { mutableStateOf(0) }
              var undo by remember { mutableStateOf<SoundState?>(null) }
              var undoMsg by remember { mutableStateOf("") }

              val ask = rememberLauncherForActivityResult(
                  ActivityResultContracts.RequestMultiplePermissions()
              ) { granted = ok() }

              LaunchedEffect(Unit) { if (!granted) ask.launch(perms()) }
              LaunchedEffect(granted) { if (granted) songs = withContext(Dispatchers.IO) { loadSongs(ctx) } }
              LaunchedEffect(undo) { if (undo != null) { delay(6000L); undo = null } }

              var player by remember { mutableStateOf<MediaController?>(null) }
              DisposableEffect(Unit) {
                  val f = MediaController.Builder(
                      ctx, SessionToken(ctx, ComponentName(ctx, PlayerService::class.java))
                  ).buildAsync()
                  f.addListener({
                      player = try { f.get() } catch (t: Throwable) { null }
                  }, MoreExecutors.directExecutor())
                  onDispose { MediaController.releaseFuture(f) }
              }

              var playing by remember { mutableStateOf(false) }
              var index by remember { mutableStateOf(-1) }
              var pos by remember { mutableStateOf(0L) }
              var dur by remember { mutableStateOf(0L) }
              var shuffle by remember { mutableStateOf(false) }
              var repeat by remember { mutableStateOf(Player.REPEAT_MODE_OFF) }

              LaunchedEffect(player, songs) {
                  val pl = player ?: return@LaunchedEffect
                  if (songs.isNotEmpty() && pl.mediaItemCount == 0) {
                      pl.setMediaItems(songs.map { sg ->
                          MediaItem.Builder().setUri(sg.uri).setMediaId(sg.id.toString())
                              .setMediaMetadata(
                                  MediaMetadata.Builder().setTitle(sg.title).setArtist(sg.artist).build()
                              ).build()
                      })
                      pl.prepare()
                      pl.play()
                  }
              }

              LaunchedEffect(player) {
                  val pl = player ?: return@LaunchedEffect
                  val l = object : Player.Listener {
                      override fun onEvents(pp: Player, events: Player.Events) {
                          playing = pp.isPlaying
                          index = pp.currentMediaItemIndex
                          dur = pp.duration.coerceAtLeast(0L)
                          shuffle = pp.shuffleModeEnabled
                          repeat = pp.repeatMode
                      }
                  }
                  pl.addListener(l)
                  try {
                      while (true) { pos = pl.currentPosition.coerceAtLeast(0L); delay(300L) }
                  } finally { pl.removeListener(l) }
              }

              val shown = remember(songs, query, sort) {
                  val q = query.trim()
                  val base = if (q.isEmpty()) songs else songs.filter {
                      it.title.contains(q, true) || it.artist.contains(q, true)
                  }
                  when (sort) {
                      1 -> base.sortedByDescending { it.duration }
                      2 -> base.sortedBy { it.artist.lowercase() }
                      3 -> base.sortedByDescending { it.dateAdded }
                      else -> base
                  }
              }
              val cur = songs.getOrNull(index)

              var page by remember { mutableStateOf(0) }

              Box(Modifier.fillMaxSize()) {
                  Aurora(p, s.motion, Modifier.fillMaxSize())
                  if (!granted) {
                      Column(Modifier.align(Alignment.Center).padding(30.dp), horizontalAlignment = Alignment.CenterHorizontally) {
                          Disc(p, false, false, 150.dp)
                          Spacer(Modifier.height(20.dp))
                          Text("دسترسی به موسیقی", color = TextHi, fontSize = 21.sp, fontWeight = FontWeight.Bold)
                          Spacer(Modifier.height(8.dp))
                          Text("برای دیدن آهنگ‌های گوشی اجازه بده.", color = TextLo, fontSize = 13.sp)
                          Spacer(Modifier.height(20.dp))
                          Button(onClick = { ask.launch(perms()) }, colors = ButtonDefaults.buttonColors(containerColor = p.a)) {
                              Text("اجازه می‌دهم", color = Color.White)
                          }
                      }
                      return@Box
                  }

                  Column(Modifier.fillMaxSize().statusBarsPadding()) {
                      Row(Modifier.fillMaxWidth().padding(horizontal = 16.dp, vertical = 9.dp),
                          verticalAlignment = Alignment.CenterVertically) {
                          Box(Modifier.size(44.dp).clip(RoundedCornerShape(15.dp))
                              .background(Brush.linearGradient(listOf(p.a, p.b, p.c))), contentAlignment = Alignment.Center) {
                              Icon(Icons.Rounded.MusicNote, null, tint = Color.White)
                          }
                          Spacer(Modifier.width(12.dp))
                          Column(Modifier.weight(1f)) {
                              Text("موزیک", color = TextHi, fontSize = 20.sp, fontWeight = FontWeight.Bold)
                              Text("${songs.size} آهنگ  ·  ${PALETTES[s.palette].name}", color = TextLo, fontSize = 11.sp)
                          }
                          Row(Modifier.clip(RoundedCornerShape(50))
                              .background(if (s.muted) Danger.copy(alpha = 0.18f) else Success.copy(alpha = 0.16f))
                              .border(1.dp, if (s.muted) Danger.copy(alpha = 0.6f) else Success.copy(alpha = 0.5f), RoundedCornerShape(50))
                              .clickable { Sound.set { it.copy(muted = !it.muted) } }
                              .padding(horizontal = 12.dp, vertical = 9.dp), verticalAlignment = Alignment.CenterVertically) {
                              Icon(if (s.muted) Icons.Rounded.VolumeOff else Icons.Rounded.MusicNote, null,
                                  tint = if (s.muted) Danger else Success, modifier = Modifier.size(17.dp))
                              Spacer(Modifier.width(6.dp))
                              Text(if (s.muted) "بی‌صدا" else "صدا", color = if (s.muted) Danger else Success,
                                  fontSize = 11.sp, fontWeight = FontWeight.Bold)
                          }
                      }

                      Box(Modifier.weight(1f).fillMaxWidth()) {
                          when (page) {
                              0 -> Column(Modifier.fillMaxSize().padding(horizontal = 18.dp, vertical = 4.dp),
                                  horizontalAlignment = Alignment.CenterHorizontally, verticalArrangement = Arrangement.SpaceEvenly) {
                                  Column(horizontalAlignment = Alignment.CenterHorizontally) {
                                      Disc(p, playing, s.motion, if (s.drivingMode) 110.dp else 142.dp)
                                      Spacer(Modifier.height(6.dp))
                                      Text(cur?.title ?: "یک آهنگ انتخاب کن", color = TextHi, fontSize = 18.sp,
                                          fontWeight = FontWeight.Bold, maxLines = 1, overflow = TextOverflow.Ellipsis)
                                      Text(cur?.artist ?: "—", color = TextLo, fontSize = 12.sp, maxLines = 1)
                                      Row(horizontalArrangement = Arrangement.spacedBy(6.dp)) {
                                          Badge(if (s.power) "EQ روشن" else "EQ خاموش", if (s.power) p.b else TextLo)
                                          if (s.surround3d) Badge("3D Surround", Info)
                                          if (s.speaker3d) Badge("3D Speaker", p.b)
                                          if (s.drivingMode) Badge("رانندگی", Warning)
                                      }
                                  }
                                  Column(Modifier.fillMaxWidth().clip(RoundedCornerShape(24.dp))
                                      .background(Color(0x1AFFFFFF)).padding(horizontal = 14.dp, vertical = 9.dp)) {
                                      val max = dur.toFloat().coerceAtLeast(1f)
                                      Slider(value = pos.toFloat().coerceIn(0f, max),
                                          onValueChange = { player?.seekTo(it.toLong()) }, valueRange = 0f..max,
                                          colors = SliderDefaults.colors(thumbColor = p.b, activeTrackColor = p.a,
                                              inactiveTrackColor = Hairline, activeTickColor = Color.Transparent,
                                              inactiveTickColor = Color.Transparent))
                                      Row(Modifier.fillMaxWidth()) {
                                          Text(fmt(pos), color = TextLo, fontSize = 10.sp)
                                          Spacer(Modifier.weight(1f))
                                          Text(fmt(dur), color = TextLo, fontSize = 10.sp)
                                      }
                                      Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceEvenly,
                                          verticalAlignment = Alignment.CenterVertically) {
                                          IconButton(onClick = { player?.let { it.shuffleModeEnabled = !shuffle } }) {
                                              Icon(Icons.Rounded.Shuffle, null, tint = if (shuffle) p.b else TextLo)
                                          }
                                          IconButton(onClick = { player?.seekToPrevious() }) {
                                              Icon(Icons.Rounded.SkipPrevious, null, tint = TextHi, modifier = Modifier.size(if (s.drivingMode) 36.dp else 30.dp))
                                          }
                                          Box(Modifier.size(if (s.drivingMode) 72.dp else 58.dp).clip(CircleShape)
                                              .background(Brush.linearGradient(listOf(p.a, p.b)))
                                              .clickable { player?.let { if (it.isPlaying) it.pause() else it.play() } },
                                              contentAlignment = Alignment.Center) {
                                              Icon(if (playing) Icons.Rounded.Pause else Icons.Rounded.PlayArrow,
                                                  null, tint = Color.White, modifier = Modifier.size(32.dp))
                                          }
                                          IconButton(onClick = { player?.seekToNext() }) {
                                              Icon(Icons.Rounded.SkipNext, null, tint = TextHi, modifier = Modifier.size(if (s.drivingMode) 36.dp else 30.dp))
                                          }
                                          IconButton(onClick = {
                                              player?.let { it.repeatMode = when (repeat) {
                                                  Player.REPEAT_MODE_OFF -> Player.REPEAT_MODE_ALL
                                                  Player.REPEAT_MODE_ALL -> Player.REPEAT_MODE_ONE
                                                  else -> Player.REPEAT_MODE_OFF
                                              } }
                                          }) {
                                              Icon(if (repeat == Player.REPEAT_MODE_ONE) Icons.Rounded.RepeatOne else Icons.Rounded.Repeat,
                                                  null, tint = if (repeat != Player.REPEAT_MODE_OFF) p.b else TextLo)
                                          }
                                      }
                                  }
                              }
                              1 -> Studio(p, s, info)
                              3 -> Column(Modifier.fillMaxSize().padding(horizontal = 22.dp, vertical = 24.dp),
                                  horizontalAlignment = Alignment.CenterHorizontally,
                                  verticalArrangement = Arrangement.spacedBy(18.dp)) {
                                  Box(Modifier.size(112.dp).clip(CircleShape)
                                      .background(Brush.linearGradient(listOf(p.a, p.b))),
                                      contentAlignment = Alignment.Center) {
                                      Icon(Icons.Rounded.DirectionsCar, null, tint = Color.White, modifier = Modifier.size(58.dp))
                                  }
                                  Text("حالت رانندگی", color = TextHi, fontSize = 22.sp, fontWeight = FontWeight.Bold)
                                  Text("کنترل‌های ساده‌تر و افکت سه‌بعدی ملایم‌تر برای گوش‌دادن در خودرو",
                                      color = TextLo, fontSize = 12.sp)
                                  Toggle("حالت رانندگی ${if (s.drivingMode) "روشن" else "خاموش"}",
                                      s.drivingMode, Warning) {
                                      Sound.set { it.copy(drivingMode = !it.drivingMode) }
                                  }
                                  Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(10.dp)) {
                                      Button(onClick = { player?.let { if (it.isPlaying) it.pause() else it.play() } },
                                          modifier = Modifier.weight(1f), colors = ButtonDefaults.buttonColors(containerColor = p.a)) {
                                          Icon(if (playing) Icons.Rounded.Pause else Icons.Rounded.PlayArrow, null)
                                          Spacer(Modifier.width(5.dp)); Text(if (playing) "مکث" else "پخش")
                                      }
                                      Button(onClick = { player?.seekToPrevious() }, modifier = Modifier.weight(1f),
                                          colors = ButtonDefaults.buttonColors(containerColor = OverlayHi)) {
                                          Icon(Icons.Rounded.SkipPrevious, null); Text("قبلی")
                                      }
                                      Button(onClick = { player?.seekToNext() }, modifier = Modifier.weight(1f),
                                          colors = ButtonDefaults.buttonColors(containerColor = OverlayHi)) {
                                          Icon(Icons.Rounded.SkipNext, null); Text("بعدی")
                                      }
                                  }
                                  Text(cur?.title ?: "آهنگی در حال پخش نیست", color = TextHi, fontSize = 14.sp,
                                      maxLines = 1, overflow = TextOverflow.Ellipsis)
                              }
                              else -> Column(Modifier.fillMaxSize().padding(horizontal = 14.dp)) {
                                  Row(Modifier.fillMaxWidth().padding(bottom = 8.dp), verticalAlignment = Alignment.CenterVertically) {
                                      Text("کتابخانه", color = TextHi, fontSize = 16.sp, fontWeight = FontWeight.Bold,
                                          modifier = Modifier.weight(1f))
                                      Text("${shown.size} نتیجه", color = TextLo, fontSize = 11.sp)
                                  }
                                  OutlinedTextField(value = query, onValueChange = { query = it }, singleLine = true,
                                      placeholder = { Text("جست‌وجوی آهنگ یا خواننده…", color = TextLo, fontSize = 13.sp) },
                                      leadingIcon = { Icon(Icons.Rounded.Search, null, tint = p.b) },
                                      shape = RoundedCornerShape(16.dp), modifier = Modifier.fillMaxWidth(),
                                      colors = OutlinedTextFieldDefaults.colors(focusedTextColor = TextHi,
                                          unfocusedTextColor = TextHi, focusedBorderColor = p.a,
                                          unfocusedBorderColor = Hairline, cursorColor = p.b,
                                          focusedContainerColor = Overlay, unfocusedContainerColor = Overlay))
                                  Spacer(Modifier.height(7.dp))
                                  Row(horizontalArrangement = Arrangement.spacedBy(6.dp)) {
                                      Chip(if (sort == 0) "نام ✓" else "نام", p.a) { sort = 0 }
                                      Chip(if (sort == 1) "مدت ✓" else "مدت", p.a) { sort = 1 }
                                      Chip(if (sort == 2) "خواننده ✓" else "خواننده", p.a) { sort = 2 }
                                      Chip(if (sort == 3) "تاریخ افزودن ✓" else "تاریخ افزودن", p.a) { sort = 3 }
                                  }
                                  Spacer(Modifier.height(7.dp))
                                  LazyColumn(Modifier.weight(1f).fillMaxWidth(),
                                      verticalArrangement = Arrangement.spacedBy(8.dp)) {
                                      if (shown.isEmpty()) item {
                                          Box(Modifier.fillMaxWidth().clip(RoundedCornerShape(20.dp))
                                              .background(Overlay).padding(24.dp), contentAlignment = Alignment.Center) {
                                              Text(if (songs.isEmpty()) "آهنگی روی گوشی پیدا نشد." else "چیزی با این عبارت پیدا نشد.",
                                                  color = TextLo, fontSize = 13.sp)
                                          }
                                      }
                                      itemsIndexed(shown, key = { _, sg -> sg.id }) { _, sg ->
                                          val active = cur?.id == sg.id
                                          Row(Modifier.fillMaxWidth().clip(RoundedCornerShape(16.dp))
                                              .background(if (active) p.a.copy(alpha = 0.22f) else Overlay)
                                              .border(1.dp, if (active) p.b.copy(alpha = 0.5f) else Color.Transparent,
                                                  RoundedCornerShape(16.dp))
                                              .clickable {
                                                  val i = songs.indexOf(sg)
                                                  if (i >= 0) player?.let { it.seekTo(i, 0L); it.play() }
                                              }.padding(10.dp), verticalAlignment = Alignment.CenterVertically) {
                                              Box(Modifier.size(42.dp).clip(CircleShape)
                                                  .background(if (active) Brush.linearGradient(listOf(p.a, p.b))
                                                      else Brush.linearGradient(listOf(OverlayHi, Overlay))),
                                                  contentAlignment = Alignment.Center) {
                                                  Icon(if (active && playing) Icons.Rounded.MusicNote else Icons.Rounded.MusicNote,
                                                      null, tint = if (active) Color.White else TextLo, modifier = Modifier.size(19.dp))
                                              }
                                              Spacer(Modifier.width(12.dp))
                                              Column(Modifier.weight(1f)) {
                                                  Text(sg.title, color = TextHi, fontSize = 14.sp, maxLines = 1,
                                                      overflow = TextOverflow.Ellipsis)
                                                  Text(sg.artist, color = TextLo, fontSize = 11.sp, maxLines = 1,
                                                      overflow = TextOverflow.Ellipsis)
                                              }
                                              Spacer(Modifier.width(8.dp))
                                              Text(fmt(sg.duration), color = TextLo, fontSize = 11.sp)
                                          }
                                      }
                                  }
                              }
                          }
                      }
                      Row(Modifier.fillMaxWidth().navigationBarsPadding()
                          .padding(horizontal = 14.dp, vertical = 8.dp)
                          .clip(RoundedCornerShape(22.dp))
                          .background(Color(0xF51B1929))
                          .border(1.dp, Color.White.copy(alpha = 0.16f), RoundedCornerShape(22.dp))
                          .padding(horizontal = 6.dp, vertical = 6.dp),
                          horizontalArrangement = Arrangement.spacedBy(5.dp)) {
                          val navItems = listOf(
                              Triple("پخش", Icons.Rounded.MusicNote, 0),
                              Triple("صدا", Icons.Rounded.MusicNote, 1),
                              Triple("آهنگ‌ها", Icons.Rounded.Search, 2),
                              Triple("رانندگی", Icons.Rounded.DirectionsCar, 3)
                          )
                          navItems.forEach { (label, navIcon, index) ->
                              val selected = page == index
                              Column(Modifier.weight(1f).clip(RoundedCornerShape(16.dp))
                                  .background(if (selected) p.a.copy(alpha = 0.30f) else Color.Transparent)
                                  .clickable { page = index }
                                  .padding(vertical = 9.dp),
                                  horizontalAlignment = Alignment.CenterHorizontally,
                                  verticalArrangement = Arrangement.Center) {
                                  Icon(navIcon, contentDescription = label,
                                      tint = if (selected) Color.White else Color(0xFFB8B5C8),
                                      modifier = Modifier.size(22.dp))
                                  Spacer(Modifier.height(4.dp))
                                  Text(label,
                                      color = if (selected) Color.White else Color(0xFFD0CDDA),
                                      fontSize = 12.sp,
                                      fontWeight = if (selected) FontWeight.Bold else FontWeight.Medium)
                                  if (selected) {
                                      Spacer(Modifier.height(3.dp))
                                      Box(Modifier.width(22.dp).height(3.dp).clip(CircleShape).background(p.b))
                                  }
                              }
                          }
                      }
                  }

                  AnimatedVisibility(
                      visible = undo != null,
                      modifier = Modifier.align(Alignment.BottomCenter).navigationBarsPadding().padding(16.dp)
                  ) {
                      Row(
                          Modifier.clip(RoundedCornerShape(18.dp))
                              .background(Color(0xF2121018))
                              .border(1.dp, p.a.copy(alpha = 0.5f), RoundedCornerShape(18.dp))
                              .padding(horizontal = 16.dp, vertical = 12.dp),
                          verticalAlignment = Alignment.CenterVertically
                      ) {
                          Text(undoMsg, color = TextHi, fontSize = 12.sp, modifier = Modifier.weight(1f))
                          Spacer(Modifier.width(12.dp))
                          Row(
                              Modifier.clip(RoundedCornerShape(12.dp))
                                  .background(p.a.copy(alpha = 0.25f))
                                  .clickable { undo?.let { prev -> Sound.set { prev } }; undo = null }
                                  .padding(horizontal = 12.dp, vertical = 7.dp),
                              verticalAlignment = Alignment.CenterVertically
                          ) {
                              Icon(Icons.Rounded.Undo, null, tint = p.b, modifier = Modifier.size(14.dp))
                              Spacer(Modifier.width(5.dp))
                              Text("بازگردانی", color = TextHi, fontSize = 11.sp)
                          }
                      }
                  }
              }
          }

          @Composable
          fun Badge(text: String, color: Color) {
              Box(
                  Modifier.clip(RoundedCornerShape(50))
                      .background(color.copy(alpha = 0.16f))
                      .border(1.dp, color.copy(alpha = 0.4f), RoundedCornerShape(50))
                      .padding(horizontal = 10.dp, vertical = 5.dp)
              ) { Text(text, color = color, fontSize = 10.sp, fontWeight = FontWeight.Bold) }
          }
          EOF
      - name: Build APK
        run: gradle assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: MusicPlayer-APK
          path: app/build/outputs/apk/debug/app-debug.apk