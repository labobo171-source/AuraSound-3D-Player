          import kotlin.math.ln
          import kotlin.math.sin
          import kotlin.random.Random

          data class Pal(
              val name: String,
              val a: Color, val b: Color, val c: Color,
              val bg1: Color, val bg2: Color, val bg3: Color
          )

          val PALETTES = listOf(
              Pal("نبولا", Color(0xFF7C3AED), Color(0xFF22D3EE), Color(0xFFF0308C),
                  Color(0xFF07060F), Color(0xFF170D33), Color(0xFF0A1030)),
              Pal("اسید", Color(0xFFA3E635), Color(0xFF06B6D4), Color(0xFF6D28D9),
                  Color(0xFF05080A), Color(0xFF0B1C13), Color(0xFF06131C)),
              Pal("ماگما", Color(0xFFF59E0B), Color(0xFFEF4444), Color(0xFFDB2777),
                  Color(0xFF0A0505), Color(0xFF26110A), Color(0xFF1A0616)),
              Pal("یخ", Color(0xFF3B82F6), Color(0xFF67E8F9), Color(0xFF6366F1),
                  Color(0xFF04070E), Color(0xFF0A1533), Color(0xFF071026))
          )

          val TextHi = Color(0xFFF3EFE9)
          val TextLo = Color(0xFF9AA3B2)
          val Success = Color(0xFF34D399)
          val Warning = Color(0xFFFBBF24)
          val Danger = Color(0xFFFB7185)
          val Info = Color(0xFF60A5FA)
          val Overlay = Color(0x14FFFFFF)
          val OverlayHi = Color(0x24FFFFFF)
          val Hairline = Color(0x1FFFFFFF)

          private fun DrawScope.blob(cx: Float, cy: Float, r: Float, c: Color) {
              val o = Offset(cx, cy)
              drawCircle(
                  Brush.radialGradient(listOf(c, Color.Transparent), center = o, radius = r),
                  radius = r, center = o
              )
          }

          @Composable
          fun Aurora(p: Pal, motion: Boolean, modifier: Modifier = Modifier) {
              val tr = rememberInfiniteTransition(label = "aurora")
              val phase by tr.animateFloat(
                  0f, 1f,
                  infiniteRepeatable(tween(30000, easing = LinearEasing), RepeatMode.Restart),
                  label = "phase"
              )
              val grain = remember {
                  val r = Random(7)
                  List(150) { Offset(r.nextFloat(), r.nextFloat()) }
              }
              Canvas(modifier) {
                  val w = size.width
                  val h = size.height
                  drawRect(Brush.verticalGradient(listOf(p.bg2, p.bg1, p.bg3)))
                  val t = if (motion) phase else 0.31f
                  val ang = t * 2f * PI.toFloat()
                  blob(w * 0.24f + sin(ang) * w * 0.16f, h * 0.14f + cos(ang * 0.8f) * h * 0.05f,
                      w * 0.85f, p.a.copy(alpha = 0.34f))
                  blob(w * 0.86f + cos(ang * 0.6f) * w * 0.14f, h * 0.42f + sin(ang * 1.1f) * h * 0.07f,
                      w * 0.70f, p.b.copy(alpha = 0.20f))
                  blob(w * 0.45f + sin(ang * 1.4f) * w * 0.20f, h * 0.88f + cos(ang * 0.5f) * h * 0.05f,
                      w * 0.80f, p.c.copy(alpha = 0.18f))
                  grain.forEach { g ->
                      drawCircle(Color.White.copy(alpha = 0.030f), radius = 1.1f,
                          center = Offset(g.x * w, g.y * h))
                  }
                  drawRect(
                      Brush.radialGradient(
                          listOf(Color.Transparent, Color.Black.copy(alpha = 0.55f)),
                          center = Offset(w / 2f, h / 2f), radius = maxOf(w, h) * 0.78f
                      )
                  )
              }
          }

          @Composable
          fun Disc(p: Pal, playing: Boolean, motion: Boolean, side: Dp) {
              val tr = rememberInfiniteTransition(label = "disc")
              val rot by tr.animateFloat(
                  0f, 360f,
                  infiniteRepeatable(tween(20000, easing = LinearEasing), RepeatMode.Restart),
                  label = "rot"
              )
              val pulse by tr.animateFloat(
                  0.35f, 1f,
                  infiniteRepeatable(tween(1600, easing = LinearEasing), RepeatMode.Reverse),
                  label = "pulse"
              )
              Box(Modifier.size(side), contentAlignment = Alignment.Center) {
                  Canvas(Modifier.size(side)) {
                      val live = if (playing && motion) pulse else 0.5f
                      val r = size.minDimension / 2f
                      drawCircle(
                          Brush.radialGradient(
                              listOf(p.b.copy(alpha = 0.30f * live), Color.Transparent),
                              center = center, radius = r
                          ), radius = r, center = center
                      )
                  }
                  Box(
                      Modifier.size(side - 16.dp).clip(CircleShape)
                          .graphicsLayer { rotationZ = if (playing && motion) rot else 0f }
                          .background(Brush.sweepGradient(listOf(p.a, p.b, p.c, p.a)))
                  )
                  Box(
                      Modifier.size(side - 30.dp).clip(CircleShape)
                          .background(Brush.radialGradient(listOf(p.bg2, p.bg1))),
                      contentAlignment = Alignment.Center
                  ) {
                      Icon(
                          Icons.Rounded.MusicNote, null, tint = TextHi,
                          modifier = Modifier.size(side * 0.28f)
                      )
                  }
              }
          }

          fun bandGains(s: SoundState, n: Int): FloatArray {
              val g = FloatArray(n)
              if (!s.power || n == 0) return g
              for (i in 0 until n) {
                  var v = s.bands.getOrElse(i) { 0f } / 100f
                  if (i == 0) v += s.bass / 100f
                  if (i == 1) v += s.bass / 200f
                  if (i == n - 1) v += s.treble / 100f
                  if (i == n - 2) v += s.treble / 200f
                  g[i] = v.coerceIn(-1f, 1f)
              }
              return g
          }

          private fun interp(freqs: List<Int>, g: FloatArray, f: Float): Float {
              if (freqs.isEmpty()) return 0f
              if (f <= freqs.first()) return g[0]
              if (f >= freqs.last()) return g[g.size - 1]
              for (i in 0 until freqs.size - 1) {
                  val a = freqs[i].toFloat()
                  val b = freqs[i + 1].toFloat()
                  if (f >= a && f <= b && b > a) {
                      val t = ((ln(f) - ln(a)) / (ln(b) - ln(a))).coerceIn(0f, 1f)
                      return g[i] + (g[i + 1] - g[i]) * t
                  }
              }
              return 0f
          }

          @Composable
          fun Spectrum(p: Pal, s: SoundState, freqs: List<Int>, playing: Boolean, modifier: Modifier = Modifier) {
              val tr = rememberInfiniteTransition(label = "spec")
              val clock by tr.animateFloat(
                  0f, 1000f,
                  infiniteRepeatable(tween(200000, easing = LinearEasing), RepeatMode.Restart),
                  label = "clock"
              )
              val bars = remember { FloatArray(44) { i -> 40f * Math.pow(1.145, i.toDouble()).toFloat() } }
              Canvas(modifier) {
                  val n = bars.size
                  val bw = size.width / n
                  val g = bandGains(s, freqs.size)
                  val boost = if (s.power) Sound.gain(s) / 15f else 0f
                  val live = playing && s.motion && s.spectrum
                  for (i in 0 until n) {
                      val curve = interp(freqs, g, bars[i])
                      val base = 0.16f + (curve + 1f) * 0.30f
                      val wob = if (live) {
                          val a = sin(clock * 2.6f + i * 0.62f)
                          val b2 = sin(clock * 1.1f + i * 0.21f)
                          (0.5f + 0.5f * a) * 0.22f + (0.5f + 0.5f * b2) * 0.14f
                      } else 0f
                      val hh = (base + wob + boost * 0.22f).coerceIn(0.05f, 1f) * size.height
                      drawRoundRect(
                          Brush.verticalGradient(
                              listOf(p.b, p.a, p.c),
                              startY = size.height - hh, endY = size.height
                          ),
                          topLeft = Offset(i * bw + bw * 0.20f, size.height - hh),
                          size = Size(bw * 0.60f, hh),
                          cornerRadius = CornerRadius(bw * 0.30f, bw * 0.30f)
                      )
                  }
              }
          }

          @Composable
          fun ScrollRail(state: LazyListState, p: Pal, modifier: Modifier = Modifier) {
              Canvas(modifier) {
                  val li = state.layoutInfo
                  val total = li.totalItemsCount
                  if (total <= 0) return@Canvas
                  val vis = li.visibleItemsInfo.size.coerceAtLeast(1)
                  val thumbFrac = (vis.toFloat() / total).coerceIn(0.08f, 1f)
                  val pos = (state.firstVisibleItemIndex + state.firstVisibleItemScrollOffset / 900f)
                  val startFrac = (pos / total).coerceIn(0f, 1f - thumbFrac)
                  val w = size.width
                  val h = size.height
                  drawRoundRect(
                      p.a.copy(alpha = 0.12f), topLeft = Offset(0f, 0f), size = Size(w, h),
                      cornerRadius = CornerRadius(w / 2f, w / 2f)
                  )
                  val th = h * thumbFrac
                  drawRoundRect(
                      Brush.verticalGradient(listOf(p.b, p.a)),
                      topLeft = Offset(0f, h * startFrac), size = Size(w, th),
                      cornerRadius = CornerRadius(w / 2f, w / 2f)
                  )
              }
          }
